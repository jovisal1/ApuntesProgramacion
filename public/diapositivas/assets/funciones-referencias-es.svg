<svg xmlns="http://www.w3.org/2000/svg" width="840" height="415" viewBox="0 0 840 415" role="img" aria-labelledby="title desc"><title id="title">Dos variables, un array compartido</title><desc id="desc">Se copia la referencia. Modificar una casilla es diferente de reasignar el parámetro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="415" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif" font-size="21"><text x="30" y="38" font-weight="700">1. Al entrar: se copia la referencia</text><rect x="30" y="66" width="260" height="60" rx="6" fill="#e1eee8"/><text x="48" y="104">main: valores</text><rect x="30" y="158" width="260" height="60" rx="6" fill="#e1eee8"/><text x="48" y="196">incrementar: datos</text><path d="M290 96H420M290 187L420 106" stroke="#005e57" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="435" y="70" width="355" height="70" rx="6" fill="#152e39"/><text x="460" y="114" fill="white">[30, 22, 100, 250, 12]</text><text x="30" y="262">2. datos[0] = 31 modifica la casilla compartida</text><text x="30" y="305">3. datos = new int[] {0, 0}: solo cambia datos</text><text x="30" y="348">valores → [31, 23, 101, 251, 13]</text><text x="30" y="386">datos → [0, 0]</text></g></svg>