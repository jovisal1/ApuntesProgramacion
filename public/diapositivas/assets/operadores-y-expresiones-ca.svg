<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img"><style>text{font-family:system-ui,sans-serif;fill:#152e39} .label{font-size:21px;fill:#526771}.value{font-size:29px;font-weight:700}.mono{font-family:monospace;font-size:25px} .box{fill:#eef4ed;stroke:#005e57;stroke-width:2}.arrow{fill:none;stroke:#005e57;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#005e57" stroke-width="1.5"/></marker></defs><rect width="800" height="210" fill="#fffefa"/><text x="50" y="55" class="mono">2 + 3 * 4</text><path d="M245 48 H310" class="arrow"/><rect x="330" y="20" width="190" height="75" rx="8" class="box"/><text x="350" y="67" class="value">3 * 4 = 12</text><path d="M425 105 V130" class="arrow"/><text x="330" y="180" class="value">2 + 12 = 14</text><text x="50" y="170" class="label">Primer *; després +</text></svg>