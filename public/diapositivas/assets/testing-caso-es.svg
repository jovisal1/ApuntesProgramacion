<svg xmlns="http://www.w3.org/2000/svg" width="840" height="365" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">Un test compara lo esperado con lo obtenido</title><desc id="desc">Un test compara lo esperado con lo obtenido</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="365" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif" font-size="20"><text x="25" y="36" font-weight="700">Un test compara lo esperado con lo obtenido</text><rect x="25" y="70" width="245" height="105" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="40" y="100" font-weight="700">Preparar</text><text x="40" y="132">a = 2; b = 3</text><text x="40" y="164">Esperado: 5</text><path d="M275 120 L307 120" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><rect x="315" y="70" width="210" height="105" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="330" y="100" font-weight="700">Ejecutar</text><text x="330" y="132">sumar(2, 3)</text><text x="330" y="164">Obtenido: 5</text><path d="M530 120 L562 120" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><rect x="570" y="70" width="245" height="105" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="585" y="100" font-weight="700">Comprobar</text><text x="585" y="132">assertEquals(5, 5)</text><text x="585" y="164">✓ Test correcto</text><rect x="25" y="220" width="790" height="115" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="40" y="250" font-weight="700">Si el método devuelve -1...</text><text x="40" y="282">assertEquals(5, -1)</text><text x="40" y="314">✕ Fallo: expected &lt;5&gt;, but was &lt;-1&gt;</text></g></svg>