<svg xmlns="http://www.w3.org/2000/svg" width="840" height="385" viewBox="0 0 840 385" role="img" aria-labelledby="title desc"><title id="title">Llamadas y retornos del factorial</title><desc id="desc">Llamadas y retornos del factorial</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="385" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif" font-size="21"><text x="26" y="34" font-weight="700">Descenso: cada llamada reduce el problema</text><rect x="30" y="65" width="330" height="45" rx="6" fill="#e1eee8"/><text x="45" y="95">factorial(3)</text><text x="500" y="95">← 3 × 2 = 6</text><rect x="65" y="127" width="330" height="45" rx="6" fill="#e1eee8"/><text x="80" y="157">factorial(2)</text><text x="500" y="157">← 2 × 1 = 2</text><rect x="100" y="189" width="330" height="45" rx="6" fill="#e1eee8"/><text x="115" y="219">factorial(1)</text><text x="500" y="219">← 1 × 1 = 1</text><rect x="135" y="251" width="330" height="45" rx="6" fill="#e1eee8"/><text x="150" y="281">factorial(0)</text><text x="500" y="281">← 1</text><path d="M445 270V90" stroke="#005e57" stroke-width="3" marker-end="url(#arrow)"/><text x="26" y="355">Regreso: se completan los productos pendientes</text></g></svg>