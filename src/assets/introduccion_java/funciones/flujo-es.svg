<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc"><title id="title">Una llamada deja una asignación pendiente</title><desc id="desc">Una llamada deja una asignación pendiente</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="420" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif"><text x="25" y="38" font-size="25" font-weight="700">Una llamada deja una asignación pendiente</text><rect x="25" y="70" width="360" height="220" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="102" font-size="20" font-weight="700">main</text><text x="43" y="133" font-size="20">int primero = 12;</text><text x="43" y="164" font-size="20">int segundo = 8;</text><text x="43" y="195" font-size="16">int total = sumar(primero, segundo);</text><text x="43" y="226" font-size="20">La asignación espera el retorno.</text><rect x="465" y="70" width="350" height="220" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="483" y="102" font-size="20" font-weight="700">sumar</text><text x="483" y="133" font-size="20">a recibe 12; b recibe 8</text><text x="483" y="164" font-size="20">resultado = a + b;</text><text x="483" y="195" font-size="20">return resultado;</text><text x="483" y="226" font-size="20">Termina esta llamada.</text><path d="M388 120 L460 120" stroke="#005e57" stroke-width="3" marker-end="url(#a)" fill="none"/><path d="M460 245 L388 245" stroke="#005e57" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="25" y="340" font-size="23">Al volver: total = 20 → println muestra 20.</text><text x="25" y="385" font-size="20">El código continúa después de la llamada, sin reiniciar main.</text></g></svg>