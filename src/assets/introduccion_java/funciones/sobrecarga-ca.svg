<svg xmlns="http://www.w3.org/2000/svg" width="840" height="465" viewBox="0 0 840 465" role="img" aria-labelledby="title desc"><title id="title">Sobrecàrrega i varargs resolen necessitats diferents</title><desc id="desc">Sobrecàrrega i varargs resolen necessitats diferents</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="465" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif"><text x="25" y="38" font-size="23" font-weight="700">Sobrecàrrega i varargs resolen necessitats diferents</text><rect x="25" y="70" width="790" height="150" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="102" font-size="20" font-weight="700">Sobrecàrrega: signatures diferents</text><text x="43" y="133" font-size="20">sumar(2, 3) → sumar(int, int)</text><text x="43" y="164" font-size="20">sumar(2.5, 3.0) → sumar(double, double)</text><text x="43" y="195" font-size="20">El compilador tria segons els arguments.</text><rect x="25" y="245" width="790" height="150" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="277" font-size="20" font-weight="700">Varargs: una quantitat variable</text><text x="43" y="308" font-size="20">sumar(1, 2, 3) → sumar(int... numeros)</text><text x="43" y="339" font-size="20">numeros → [1, 2, 3]</text><text x="43" y="370" font-size="20">Només un varargs; sempre l’últim paràmetre.</text><text x="25" y="435" font-size="20">Estos dissenys s’estudien per separat en els exemples.</text></g></svg>