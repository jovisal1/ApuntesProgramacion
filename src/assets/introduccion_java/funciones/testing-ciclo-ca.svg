<svg xmlns="http://www.w3.org/2000/svg" width="840" height="365" viewBox="0 0 840 365" role="img" aria-labelledby="title desc"><title id="title">L’error informa; la correcció es torna a comprovar</title><desc id="desc">L’error informa; la correcció es torna a comprovar</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="365" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif" font-size="20"><text x="25" y="36" font-weight="700">L’error informa; la correcció es torna a comprovar</text><rect x="25" y="80" width="240" height="110" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="40" y="110" font-weight="700">1. Executar</text><text x="40" y="142">Tots els tests</text><path d="M270 130 L295 130" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><rect x="300" y="80" width="240" height="110" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="315" y="110" font-weight="700">2. Llegir l’error</text><text x="315" y="142">Esperat ≠ obtingut</text><path d="M545 130 L570 130" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><rect x="575" y="80" width="240" height="110" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="590" y="110" font-weight="700">3. Corregir</text><text x="590" y="142">Mètode o expectativa</text><path d="M695 195 L695 240" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><path d="M695 240 L145 240" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><path d="M145 240 L145 195" fill="none" stroke="#005e57" stroke-width="3" marker-end="url(#a)"/><text x="25" y="292">Recompilar i repetir la bateria: detectar regressions.</text><text x="25" y="334">Passar els tests no garantix tots els casos possibles.</text></g></svg>