<svg xmlns="http://www.w3.org/2000/svg" width="840" height="425" viewBox="0 0 840 425" role="img" aria-labelledby="title desc"><title id="title">Cada nombre tiene un ámbito</title><desc id="desc">Cada nombre tiene un ámbito</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="425" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif"><text x="25" y="38" font-size="25" font-weight="700">Cada nombre tiene un ámbito</text><rect x="25" y="65" width="790" height="95" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="97" font-size="20" font-weight="700">AmbitoCampos</text><text x="43" y="128" font-size="20">Campo de clase: private static int puntos = 100;</text><rect x="25" y="185" width="365" height="160" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="217" font-size="20" font-weight="700">main</text><text x="43" y="248" font-size="20">int puntos = 20;</text><text x="43" y="279" font-size="20">println(puntos) → 20</text><text x="43" y="310" font-size="16">println(AmbitoCampos.puntos) → 100</text><rect x="445" y="185" width="370" height="160" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="463" y="217" font-size="20" font-weight="700">mostrarPuntos</text><text x="463" y="248" font-size="20">Sin una variable local puntos.</text><text x="463" y="279" font-size="20">println(puntos) → 100</text><text x="25" y="390" font-size="22">La variable local oculta el campo; no cambia su valor.</text></g></svg>