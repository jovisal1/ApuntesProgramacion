<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="title desc"><title id="title">Entrada → treball → resultat</title><desc id="desc">Entrada → treball → resultat</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="350" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif"><text x="25" y="38" font-size="25" font-weight="700">Entrada → treball → resultat</text><rect x="25" y="75" width="225" height="115" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="107" font-size="20" font-weight="700">1. Arguments</text><text x="43" y="138" font-size="20">sumar(12, 8)</text><text x="43" y="169" font-size="20">12 → a; 8 → b</text><path d="M255 128 L297 128" stroke="#005e57" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="305" y="75" width="225" height="115" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="323" y="107" font-size="20" font-weight="700">2. Cos</text><text x="323" y="138" font-size="20">resultado = a + b</text><text x="323" y="169" font-size="20">resultado = 20</text><path d="M535 128 L577 128" stroke="#005e57" stroke-width="3" marker-end="url(#a)" fill="none"/><rect x="585" y="75" width="230" height="115" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="603" y="107" font-size="20" font-weight="700">3. Retorn</text><text x="603" y="138" font-size="20">return resultado;</text><text x="603" y="169" font-size="20">20 → main</text><text x="25" y="235" font-size="23" font-weight="700">public static int sumar(int a, int b) { ... }</text><text x="25" y="280" font-size="21">public: accés · static: mètode de classe</text><text x="25" y="315" font-size="20">int: tipus retornat · sumar: nom · int a, int b: paràmetres</text></g></svg>