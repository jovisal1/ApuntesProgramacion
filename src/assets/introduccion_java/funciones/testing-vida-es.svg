"none" marker-end="url(#a)"/><rect x="25" y="370" width="790" height="60" rx="7" fill="#e1eee8" stroke="#52756d"/><text x="41" y="405">@AfterAll · 1 vez</text><text x="25" y="470">Cada test recibe datos nuevos; no depende del orden.</text></g></svg>