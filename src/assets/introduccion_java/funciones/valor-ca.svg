<svg xmlns="http://www.w3.org/2000/svg" width="840" height="425" viewBox="0 0 840 425" role="img" aria-labelledby="title desc"><title id="title">Dos variables, dos valors independents</title><desc id="desc">Dos variables, dos valors independents</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005e57"/></marker></defs><rect width="840" height="425" rx="12" fill="#fffdf5"/><g fill="#152e39" font-family="system-ui,sans-serif"><text x="25" y="38" font-size="25" font-weight="700">Dos variables, dos valors independents</text><rect x="25" y="75" width="325" height="130" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="107" font-size="20" font-weight="700">main</text><text x="43" y="138" font-size="20">int numero = 10;</text><text x="43" y="169" font-size="20">Conserva el valor 10.</text><path d="M355 130 L480 130" stroke="#005e57" stroke-width="3" marker-end="url(#a)" fill="none"/><text x="360" y="110" font-size="19">còpia</text><rect x="490" y="75" width="325" height="130" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="508" y="107" font-size="20" font-weight="700">calcular(int valor)</text><text x="508" y="138" font-size="20">valor = 10;</text><text x="508" y="169" font-size="20">Rep una còpia.</text><rect x="25" y="245" width="325" height="100" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="43" y="277" font-size="20" font-weight="700">Després de cridar</text><text x="43" y="308" font-size="20">numero = 10</text><rect x="490" y="245" width="325" height="100" rx="8" fill="#e1eee8" stroke="#52756d"/><text x="508" y="277" font-size="20" font-weight="700">valor += 50;</text><text x="508" y="308" font-size="20">valor = 60</text><text x="25" y="390" font-size="20">Per a guardar un càlcul fora: retornar-lo i assignar-lo en main.</text></g></svg>